<!doctype html><meta charset="utf-8"><title>LTV push</title>
<body style="font:20px sans-serif;padding:20px">loading…
<script>
let B=null, st='loading', err='';
const q=new URLSearchParams(location.search);
fetch(q.get('src')).then(r=>r.blob()).then(b=>{B=b;st='ready';document.body.textContent='ready '+b.size;
  if(window.opener){try{window.opener.postMessage({kind:'ltvvid',blob:B},'*')}catch(e){}}
}).catch(e=>{st='err';err=String(e);document.body.textContent='err '+e});
window.addEventListener('message',e=>{
  if(e.data==='ping'){ if(B){e.source.postMessage({kind:'ltvvid',blob:B},'*'); document.body.textContent='sent '+B.size;} else e.source.postMessage({kind:'status',st,err,opener:!!window.opener},'*'); }
  if(e.data==='close') window.close();
});
</script>
